services:
  mysql:
    image: mysql:8.4
    container_name: tcpgroupchat-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: tcpgroupchat
      MYSQL_USER: tcpchat
      MYSQL_PASSWORD: tcpchat
      MYSQL_ROOT_PASSWORD: tcpchat_root
    ports:
      - "3306:3306"
    volumes:
      - tcpgroupchat_mysql:/var/lib/mysql
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tcpgroupchat_mysql:
